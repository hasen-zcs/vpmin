<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>球化亮光检测 · vpmin</title>
<style>
  :root{
    --primary:#1677ff; --primary-hover:#4096ff; --primary-weak:#e8f2ff;
    --bg:#f4f6fa; --card:#fff; --line:#e6eaf0; --ink:#1f2d3d; --muted:#8492a6;
    --ok:#12a150; --bad:#e5484d;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei",-apple-system,Arial,sans-serif;font-size:13px;color:var(--ink);
       background:var(--bg);-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}
  button{cursor:pointer}
  a{color:inherit}

  /* 顶栏 */
  .appbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 20px;background:#fff;
          border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:#0f172a}
  .brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#1677ff,#0ea5e9);
               display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .brand small{font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.02em}
  .appbar .pill{margin-left:auto;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
                background:#f6f8fb;border:1px solid var(--line);font-size:12px;color:#475467}
  .appbar .pill::before{width:7px;height:7px;border-radius:50%;background:#f59e0b;content:""}
  .appbar .pill.online::before{background:var(--ok);box-shadow:0 0 0 3px rgba(18,161,80,.12)}
  .appbar .pill.offline::before{background:var(--bad)}

  /* 主体 */
  main{max-width:1560px;margin:0 auto;padding:16px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
  .card+.card{margin-top:16px}
  .card-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .card-head h2{font-size:13px;font-weight:700;color:#0f172a}
  .card-head .spacer{margin-left:auto}
  .chip{font-size:11px;color:#475467;background:#f6f8fb;border:1px solid var(--line);
        border-radius:999px;padding:2px 9px;white-space:nowrap}
  .chip.run{color:#0b5cd5;background:#e8f2ff;border-color:#bcd9ff}
  .chip.run::before{content:"● ";color:#1677ff}
  .chip.live{color:#0f7b3f;background:#eafaf0;border-color:#c7ebd5}
  .chip.live::before{content:"● ";color:var(--ok)}
  .chip.off{color:#b54708;background:#fff6e8;border-color:#f5d9b0}
  .chip.off::before{content:"● ";color:#f59e0b}
  .card-body{padding:14px}

  /* 画面 */
  .video-stage{display:flex;justify-content:center;gap:8px;padding:12px;background:#fafbfd}
  .video-stage .video-box{flex:0 1 720px}
  .video-box{position:relative;flex:1;min-width:0;background:#0b0d12;border-radius:6px;overflow:hidden}
  .video-box img{display:block;width:100%;height:auto;background:#0b0d12}
  #overlay{position:absolute;inset:0;width:100%;height:100%;cursor:default;touch-action:none}
  #overlay.draw{cursor:crosshair}
  .cam-label{position:absolute;left:10px;bottom:10px;padding:3px 9px;border-radius:4px;font-size:11px;
             color:rgba(255,255,255,.92);background:rgba(15,23,42,.55);backdrop-filter:blur(2px)}
  .live{position:absolute;right:10px;top:10px;padding:2px 8px;border-radius:999px;font-size:11px;
        color:#d1fae5;background:rgba(15,23,42,.55)}
  .live::before{content:"● ";color:#34d399}
  .live.off{color:#ffedd5} .live.off::before{color:#fb923c}
  .ph{position:absolute;inset:0;display:grid;place-items:center;color:#94a3b8;font-size:12px;background:#0b0d12}

  /* 工具栏 */
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
  .btn{min-height:30px;padding:6px 13px;border-radius:6px;border:1px solid var(--line);background:#fff;
       color:#344054;font-size:12px;transition:.15s}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
  .btn.on{background:var(--primary-weak);border-color:var(--primary);color:var(--primary)}
  .toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .toolbar .spacer{margin-left:auto}
  .link{font-size:12px;color:var(--primary);text-decoration:none;padding:4px 2px}
  .link:hover{color:var(--primary-hover)}
  .select{min-height:30px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;
          color:#344054;max-width:190px}

  /* 指标 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
  .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:#0f172a}
  .stat .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
  .stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)}
  .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:11.5px;margin-top:10px}
  .meta b{color:#475467;font-weight:600}

  /* 曲线 */
  #curve{display:block;width:100%;height:240px}

  /* 表单 */
  .params{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .params .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .params input{width:100%;height:30px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;
                background:#fff;color:#1f2d3d;font-variant-numeric:tabular-nums}
  .params input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.12)}
  .params .full{grid-column:1 / -1}
  .params .save{width:100%;height:32px;border-radius:6px}

  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{position:sticky;top:0;background:#f8fafc;color:#667085;font-weight:600;text-align:left;
     padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:7px 12px;border-bottom:1px solid #f1f3f7;color:#344054;white-space:nowrap}
  tbody tr:hover{background:#fafbff}
  td.num{font-variant-numeric:tabular-nums;text-align:right;color:#475467}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .dot.start{background:var(--primary)} .dot.end{background:var(--bad)}
  .scroll{max-height:236px;overflow:auto}
  .empty{padding:20px 12px;text-align:center;color:var(--muted);font-size:12px}

  /* 存档 */
  .shots{display:flex;flex-wrap:wrap;gap:8px;max-height:120px;overflow:auto}
  .shots a{font-size:11px;color:var(--primary);text-decoration:none;border:1px solid #d6e6ff;
           background:#f5f9ff;border-radius:999px;padding:3px 10px}
  .shots a:hover{background:var(--primary-weak)}
  .hintline{padding:8px 14px 0;color:var(--muted);font-size:11.5px}

  @media (max-width:1120px){
    .layout{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="mark">球</span>球化亮光检测 <small>vpmin · 浇注工位</small></div>
  <button class="pill" id="sys" type="button">连接中</button>
</header>

<main>
  <div class="layout">
    <section>
      <!-- 实时画面 -->
      <div class="card">
        <div class="card-head">
          <h2>实时画面</h2>
          <span class="spacer"></span>
          <span class="chip" id="state">未开始</span>
          <span class="chip" id="caminfo">--</span>
        </div>

        <div class="video-stage">
          <div class="video-box" id="box1">
            <img id="view" src="/api/video.mjpg?cam=1" alt="分析机位">
            <canvas id="overlay"></canvas>
            <div class="ph" id="ph1">等待视频流接入</div>
            <span class="cam-label" id="label1">浇注工位 #01</span>
            <span class="live" id="live1">视频流</span>
          </div>
          <div class="video-box" id="box2" style="display:none">
            <img id="view2" src="/api/video.mjpg?cam=2" alt="查看机位">
            <div class="ph" id="ph2">等待视频流接入</div>
            <span class="cam-label" id="label2">浇注工位 #02</span>
            <span class="live" id="live2">视频流</span>
          </div>
        </div>

        <div class="toolbar">
          <button id="start" class="btn primary">开始分析</button>
          <button id="stop" class="btn">停止分析</button>
          <button id="refresh" class="btn">读后端标准</button>
          <span class="sep"></span>
          <button id="roiRect" class="btn">画矩形</button>
          <button id="roiPoly" class="btn">画多边形</button>
          <button id="roiEdit" class="btn">编辑坐标</button>
          <button id="roiUndo" class="btn">撤销</button>
          <button id="roiRedo" class="btn">重做</button>
          <button id="roiCancel" class="btn">取消绘制</button>
          <select id="roiHistory" class="select"><option value="">历史 ROI…</option></select>
          <button id="roiApply" class="btn">套用</button>
          <span class="spacer"></span>
          <a class="link" href="/download/frames.csv">逐帧 CSV</a>
          <a class="link" href="/download/events.csv">事件 CSV</a>
        </div>
      </div>

      <!-- 指标 -->
      <div class="stats">
        <div class="stat"><div class="k">已判反应</div><div class="v"><span id="count">0</span><small>条</small></div></div>
        <div class="stat"><div class="k">反应时长</div><div class="v" id="dur">--</div></div>
        <div class="stat"><div class="k">判定结果</div><div class="v" id="verdict">--</div></div>
        <div class="stat"><div class="k">判定区间</div><div class="v" id="win">--</div></div>
      </div>
      <!-- 曲线 -->
      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>本次反应灰度曲线</h2><span class="spacer"></span>
          <span class="chip">实时</span></div>
        <div class="card-body" style="padding:10px 12px 6px">
          <canvas id="curve" width="960" height="270"></canvas>
        </div>
      </div>
    </section>

    <aside>
      <!-- 参数 -->
      <div class="card">
        <div class="card-head"><h2>检测参数</h2><span class="spacer"></span>
          <span class="chip">下一帧生效</span></div>
        <div class="card-body">
          <form id="params" class="params">
            <div class="field"><label>开始像素</label><input name="start_pixel" type="number"></div>
            <div class="field"><label>结束像素</label><input name="end_pixel" type="number"></div>
            <div class="field"><label>开始占比 %</label><input name="start_threshold" type="number" step="0.1"></div>
            <div class="field"><label>结束占比 %</label><input name="end_threshold" type="number" step="0.1"></div>
            <div class="field"><label>开始确认 s</label><input name="start_confirm" type="number" step="0.1"></div>
            <div class="field"><label>结束确认 s</label><input name="end_confirm" type="number" step="0.1"></div>
            <div class="field"><label>回退下限 s</label><input name="standard_min" type="number" step="0.1"></div>
            <div class="field"><label>回退上限 s</label><input name="standard_max" type="number" step="0.1"></div>
            <div class="field"><label>容差 ±s</label><input name="standard_tolerance" type="number" step="0.1"></div>
            <div class="field"><label>最长分析 s</label><input name="max_seconds" type="number" step="1"></div>
            <div class="full"><button type="submit" class="btn primary save">保存参数</button></div>
          </form>
        </div>
      </div>

      <!-- 运行信息 -->
      <div class="card">
        <div class="card-head"><h2>运行信息</h2></div>
        <div class="card-body" style="display:grid;gap:7px;color:var(--muted);font-size:12px">
          <div id="roiInfo">ROI：未设置</div>
          <div id="hint">--</div>
        </div>
      </div>

      <!-- 事件 -->
      <div class="card">
        <div class="card-head"><h2>事件</h2><span class="spacer"></span><span class="chip" id="eventCount">0 条</span></div>
        <div class="scroll">
          <table>
            <thead><tr><th style="width:34%">事件</th><th style="width:24%">时刻 s</th><th style="width:20%">灰度</th><th style="width:22%;text-align:right">时长 s</th></tr></thead>
            <tbody id="events"><tr><td colspan="4" class="empty">暂无事件</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- 存档 -->
      <div class="card">
        <div class="card-head"><h2>曲线图存档</h2><span class="spacer"></span><span class="chip" id="shotCount">0 张</span></div>
        <div class="card-body"><div id="shots" class="shots"><span class="empty">暂无存档</span></div></div>
      </div>
    </aside>
  </div>
</main>

<script src="/roi.js"></script>
<script src="/app.js"></script>
</body>
</html>
